[package]
name = "zeke-engine"
version.workspace = true
# Edition 2021: 2024 changes `if let` temporary drop order, which this code relies on.
edition = "2021"
license.workspace = true
publish = false

[dependencies]
alsa = "0.10"
async-channel = "2"
crossbeam-channel = "0.5"
gstreamer = "0.25"
gstreamer-app = "0.25"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeke-tidal = { path = "../tidal" }
