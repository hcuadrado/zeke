[package]
name = "zeke-player"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-channel = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
zeke-engine = { path = "../engine" }
zeke-tidal = { path = "../tidal" }

[dev-dependencies]
tempfile = "3"
